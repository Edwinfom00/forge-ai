[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-ai-engine"
version = "0.0.1"
description = "ForgeAI AI Engine — The 12-engine compilation pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn[standard]==0.29.0",
  "pydantic==2.7.0",
  "pydantic-settings==2.2.1",
  "langchain==0.2.0",
  "langchain-openai==0.1.6",
  "langchain-community==0.2.0",
  "pgvector==0.2.5",
  "psycopg2-binary==2.9.9",
  "redis==5.0.4",
  "httpx==0.27.0",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.6",
  "ruff==0.4.2",
  "mypy==1.10.0",
]

[tool.ruff]
line-length = 100
select = ["E", "W", "F", "I"]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
